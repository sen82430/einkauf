<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f8ee">
<title>Einkaufsliste</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f8ee;
    --card: #ffffff;
    --ink: #17794a;
    --ink-soft: #e6f5ec;
    --text: #16241c;
    --muted: #56665d;
    --line: #e3eadd;
    --done: #93a199;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--bg); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 1.1875rem;
    line-height: 1.3;
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }

  .sheet { max-width: 34rem; margin: 0 auto; }

  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 2;
    background: var(--bg);
    padding: 0.875rem 1rem 0.75rem;
  }
  h1 {
    margin: 0;
    font-size: 1.625rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .live {
    float: right;
    margin: 0.25rem 0 0;
    font-size: 0.8125rem;
    color: var(--muted);
  }
  .live::before {
    content: "";
    display: inline-block;
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: #c9a227;
    margin-right: 0.375rem;
  }
  .live.on::before { background: var(--ink); }
  .status {
    margin: 0.125rem 0 0.5rem;
    color: var(--ink);
    font-weight: 700;
    font-size: 1rem;
  }
  .bar {
    height: 0.625rem;
    background: #dfe8d6;
    border-radius: 1rem;
    overflow: hidden;
  }
  .bar > span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--ink);
    border-radius: 1rem;
    transition: width 0.25s ease;
  }

  main { padding: 0.25rem 0.75rem 1rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 1rem;
    margin-top: 0.875rem;
    overflow: hidden;
  }
  h2 {
    margin: 0;
    padding: 0.75rem 1rem;
    font-size: 1.0625rem;
    font-weight: 800;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--ink-soft);
    color: var(--ink);
  }
  h2 small {
    font-weight: 700;
    font-size: 0.875rem;
    background: var(--card);
    border-radius: 1rem;
    padding: 0.125rem 0.625rem;
  }

  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 1px solid var(--line); }

  label {
    display: flex;
    align-items: center;
    gap: 0.875rem;
    min-height: 3.75rem;
    padding: 0.5rem 1rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  label:active { background: var(--ink-soft); }
  input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    width: 2rem;
    height: 2rem;
    margin: 0;
    border: 2.5px solid var(--ink);
    border-radius: 50%;
    background: var(--card);
    display: grid;
    place-content: center;
    cursor: pointer;
  }
  input[type="checkbox"]::after {
    content: "";
    width: 0.5rem;
    height: 0.95rem;
    border: solid #ffffff;
    border-width: 0 0.1875rem 0.1875rem 0;
    transform: rotate(45deg) scale(0);
    margin-top: -0.2rem;
    transition: transform 0.12s ease;
  }
  input[type="checkbox"]:checked { background: var(--ink); }
  input[type="checkbox"]:checked::after { transform: rotate(45deg) scale(1); }
  input[type="checkbox"]:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .name { flex: 1; font-weight: 600; }
  .qty {
    flex: none;
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--muted);
    background: var(--bg);
    border-radius: 0.5rem;
    padding: 0.25rem 0.5rem;
  }
  .qty:empty { display: none; }
  input:checked ~ .name { color: var(--done); text-decoration: line-through; font-weight: 500; }
  input:checked ~ .qty { color: var(--done); background: transparent; }
  li:has(input:checked) { background: #f7faf4; }

  footer { padding: 0.25rem 0.75rem 2rem; }
  button {
    font: inherit;
    font-weight: 700;
    width: 100%;
    min-height: 3.25rem;
    border: 2px solid var(--ink);
    border-radius: 1rem;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  button.armed { background: var(--ink); color: #ffffff; }
  button + button { margin-top: 0.75rem; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .bar > span, input[type="checkbox"]::after { transition: none; }
  }
  li.x { display: flex; align-items: center; }
  li.x label { flex: 1; min-width: 0; }
  .del {
    flex: none;
    width: auto;
    min-width: 2.75rem;
    min-height: 2.75rem;
    margin-right: 0.5rem;
    padding: 0 0.75rem;
    border: 0;
    border-radius: 0.75rem;
    background: transparent;
    color: var(--muted);
    font-size: 1.5rem;
    line-height: 1;
  }
  .del.armed { font-size: 0.9375rem; }
  .add { display: grid; gap: 0.75rem; padding: 1rem; }
  .add input {
    appearance: none;
    -webkit-appearance: none;
    font: inherit;
    width: 100%;
    min-height: 3.25rem;
    padding: 0 1rem;
    border: 2px solid var(--line);
    border-radius: 1rem;
    background: var(--card);
    color: var(--text);
  }
  .add input:focus { outline: none; border-color: var(--ink); }
  button.primary { background: var(--ink); color: #ffffff; }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <h1>Einkaufsliste</h1>
    <p class="live" id="live" hidden></p>
    <p class="status" id="status">4 Sachen zum Abhaken</p>
    <div class="bar" id="bar" hidden aria-hidden="true"><span id="fill"></span></div>
  </header>
  <main>
<!-- LISTE-START -->
<section class="card">
<h2><span>🥦 Gemüse &amp; Früchte</span><small data-count></small></h2>
<ul>
<li><label><input type="checkbox" data-id="auberginen"><span class="name">Auberginen</span><span class="qty">2×</span></label></li>
<li><label><input type="checkbox" data-id="rispentomaten"><span class="name">Rispentomaten</span><span class="qty">1 kg</span></label></li>
</ul>
</section>
<section class="card">
<h2><span>🥩 Fleisch, Fisch &amp; Veggie</span><small data-count></small></h2>
<ul>
<li><label><input type="checkbox" data-id="schinkenscheiben"><span class="name">Schinkenscheiben</span><span class="qty">1 Packung</span></label></li>
</ul>
</section>
<section class="card">
<h2><span>🥛 Milchprodukte &amp; Eier</span><small data-count></small></h2>
<ul>
<li><label><input type="checkbox" data-id="kaesescheiben"><span class="name">Käsescheiben</span><span class="qty">1 Packung</span></label></li>
</ul>
</section>
<!-- LISTE-ENDE -->
<section class="card" id="extra" hidden>
<h2><span>📝 Nachträglich</span><small data-count></small></h2>
<ul id="extraList"></ul>
</section>
<section class="card" id="addCard" hidden>
<h2><span>➕ Hinzufügen</span></h2>
<form class="add" id="add" autocomplete="off">
<input type="text" id="addName" placeholder="Was? z. B. Aubergine" aria-label="Was?" maxlength="60" enterkeyhint="next">
<input type="text" id="addQty" placeholder="Wie viel? z. B. 2 Stk" aria-label="Wie viel?" maxlength="30" enterkeyhint="done">
<button type="submit" class="primary">Auf die Liste setzen</button>
</form>
</section>
  </main>
  <footer>
    <button type="button" id="reset" hidden>Alle Häkchen entfernen (für alle)</button>
    <button type="button" id="reload" hidden>Liste neu laden</button>
  </footer>
</div>
<script>
(function(){
  var TOPIC="einkauf-C0rYCgPKos2jGUsJ6S9zVW";
  var BUILD=1791279263;
  var DB="https://einkauf-b36df-default-rtdb.europe-west1.firebasedatabase.app";
  var BASE=DB+"/listen/"+TOPIC;
  var KEY="einkauf-fb-"+TOPIC;
  var mir={}, outbox=[], es=null, flushing=false, synced=false, lastSig=null;
  var bootV=0,lastCheck=0,lastBeat=0,lastConn=0;

  try{
    var q=/[?&]v=(\d+)/.exec(location.search);
    if(q){bootV=+q[1];history.replaceState(null,"",location.pathname+location.hash);}
  }catch(e){}

  function reload(){location.replace(location.pathname+"?v="+Date.now());}

  var main=document.querySelector("main");
  var status=document.getElementById("status"),fill=document.getElementById("fill");
  var live=document.getElementById("live"),resetBtn=document.getElementById("reset");
  var reloadBtn=document.getElementById("reload");
  var extra=document.getElementById("extra"),extraList=document.getElementById("extraList");
  var form=document.getElementById("add");
  var nameIn=document.getElementById("addName"),qtyIn=document.getElementById("addQty");

  function checkUpdate(){
    if(Date.now()-lastCheck<8000)return;
    lastCheck=Date.now();
    fetch(location.pathname+"?fresh="+Date.now(),{cache:"no-store"}).then(function(r){
      if(!r.ok)throw new Error("fresh");
      return r.text();
    }).then(function(txt){
      var m=/var BUILD=(\d+)/.exec(txt);
      if(m&&+m[1]>BUILD&&Date.now()-bootV>10000&&!nameIn.value&&!qtyIn.value)reload();
    }).catch(function(){});
  }

  function obj(x){return x&&typeof x==="object"&&!Array.isArray(x)?x:{};}

  try{
    var s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(s){mir=obj(s.mir);outbox=Array.isArray(s.outbox)?s.outbox:[];}
  }catch(e){}
  function persist(){
    try{localStorage.setItem(KEY,JSON.stringify({mir:mir,outbox:outbox}));}catch(e){}
  }

  document.getElementById("bar").hidden=false;
  document.getElementById("addCard").hidden=false;
  live.hidden=false;resetBtn.hidden=false;reloadBtn.hidden=false;

  function setLive(ok){
    live.className="live"+(ok?" on":"");
    live.textContent=ok?"Live verbunden":"Keine Verbindung, wird nachgesendet";
  }

  function setPath(path,data){
    var p=String(path).split("/").filter(Boolean),o=mir,i;
    for(i=0;i<p.length;i++){
      if(p[i]==="__proto__"||p[i]==="constructor"||p[i]==="prototype")return;
    }
    if(!p.length){mir=obj(data);return;}
    for(i=0;i<p.length-1;i++){
      if(!Object.prototype.hasOwnProperty.call(o,p[i])||!o[p[i]]||typeof o[p[i]]!=="object")o[p[i]]={};
      o=o[p[i]];
    }
    if(data===null||data===undefined)delete o[p[i]];
    else o[p[i]]=data;
  }

  function apply(S,op){
    if(!op||typeof op.t!=="number")return;
    if(op.k==="c"){
      if(op.t>S.r&&(!S.c[op.i]||op.t>=S.c[op.i].t))S.c[op.i]={v:op.v?1:0,t:op.t};
    }else if(op.k==="a"){
      S.a[op.i]={n:op.n,q:op.q,t:op.t};
    }else if(op.k==="d"){
      delete S.a[op.i];
    }else if(op.k==="r"){
      if(op.t>S.r){S.r=op.t;S.c=Object.create(null);}
    }
  }

  function view(){
    var S={c:Object.create(null),a:Object.create(null),r:typeof mir.r==="number"?mir.r:0};
    var c=obj(mir.c),a=obj(mir.a);
    Object.keys(c).forEach(function(k){
      var e=c[k];
      if(e&&typeof e.t==="number")S.c[k]={v:e.v?1:0,t:e.t};
    });
    Object.keys(a).forEach(function(k){
      var e=a[k];
      if(e&&typeof e.n==="string"&&e.n.trim())S.a[k]={n:e.n.slice(0,80),q:typeof e.q==="string"?e.q.slice(0,40):"",t:+e.t||0};
    });
    outbox.forEach(function(op){apply(S,op);});
    return S;
  }

  function render(){
    var S=view();
    var ids=Object.keys(S.a).sort(function(x,y){return S.a[x].t-S.a[y].t||(x<y?-1:1);});
    var sig=JSON.stringify(ids.map(function(k){return [k,S.a[k].n,S.a[k].q];}));
    if(sig!==lastSig){
      lastSig=sig;
      extraList.textContent="";
      ids.forEach(function(k){
        var li=document.createElement("li"),lab=document.createElement("label");
        var cb=document.createElement("input"),n=document.createElement("span");
        var qy=document.createElement("span"),del=document.createElement("button");
        li.className="x";
        cb.type="checkbox";cb.setAttribute("data-id",k);
        n.className="name";n.textContent=S.a[k].n;
        qy.className="qty";qy.textContent=S.a[k].q;
        del.type="button";del.className="del";del.setAttribute("data-del",k);
        del.textContent="\u00d7";del.setAttribute("aria-label",S.a[k].n+" löschen");
        lab.appendChild(cb);lab.appendChild(n);lab.appendChild(qy);
        li.appendChild(lab);li.appendChild(del);extraList.appendChild(li);
      });
      extra.hidden=!ids.length;
    }
    var boxes=[].slice.call(main.querySelectorAll("input[type=checkbox]")),done=0;
    boxes.forEach(function(b){
      var st=S.c[b.getAttribute("data-id")];
      b.checked=!!(st&&st.v);
    });
    [].forEach.call(main.querySelectorAll("ul"),function(ul){
      var b=ul.querySelectorAll("input"),c=ul.querySelectorAll("input:checked").length;
      done+=c;
      ul.previousElementSibling.querySelector("small").textContent=c+" von "+b.length;
    });
    status.textContent=!boxes.length?"Noch nichts auf der Liste":done===boxes.length?"Alles eingepackt, ab zur Kasse.":done+" von "+boxes.length+" eingepackt";
    fill.style.width=(boxes.length?done/boxes.length*100:0)+"%";
  }

  function flush(){
    if(flushing||!outbox.length||!synced)return;
    var op=outbox[0],url=BASE,method="PUT",body=null,cur;
    if(op.k==="c"){
      cur=obj(mir.c)[op.i];
      if((+mir.r||0)>=op.t||(cur&&cur.t>op.t)){outbox.shift();persist();render();flush();return;}
      url+="/c/"+encodeURIComponent(op.i);body={v:op.v?1:0,t:op.t};
    }else if(op.k==="a"){
      url+="/a/"+encodeURIComponent(op.i);body={n:op.n,q:op.q,t:op.t};
    }else if(op.k==="d"){
      url+="/a/"+encodeURIComponent(op.i);method="DELETE";
    }else if(op.k==="r"){
      method="PATCH";body={c:null,r:op.t};
    }else{outbox.shift();persist();flush();return;}
    flushing=true;
    fetch(url+".json",{method:method,body:body?JSON.stringify(body):undefined}).then(function(r){
      if(!r.ok&&r.status!==400)throw new Error("send");
      if(r.ok){
        if(op.k==="c")setPath("/c/"+op.i,body);
        else if(op.k==="a")setPath("/a/"+op.i,body);
        else if(op.k==="d")setPath("/a/"+op.i,null);
        else{setPath("/c",null);setPath("/r",op.t);}
      }
      outbox.shift();persist();flushing=false;render();setLive(true);flush();
    }).catch(function(){flushing=false;setLive(false);});
  }

  function send(op){
    outbox.push(op);persist();render();flush();
  }

  function beat(){lastBeat=Date.now();}

  function onData(e,patch){
    beat();
    try{
      var m=JSON.parse(e.data);
      if(!m||typeof m.path!=="string")return;
      if(patch){
        Object.keys(obj(m.data)).forEach(function(k){setPath(m.path+"/"+k,m.data[k]);});
      }else{
        setPath(m.path,m.data);
        if(m.path==="/")synced=true;
      }
      persist();render();setLive(true);flush();
    }catch(x){}
  }

  function connect(){
    try{
      if(es)es.close();
      synced=false;lastConn=Date.now();beat();
      es=new EventSource(BASE+".json");
      es.onopen=beat;
      es.addEventListener("put",function(e){onData(e,false);});
      es.addEventListener("patch",function(e){onData(e,true);});
      es.addEventListener("keep-alive",beat);
      es.addEventListener("cancel",function(){synced=false;setLive(false);});
      es.onerror=function(){synced=false;setLive(false);};
    }catch(e){setLive(false);}
  }

  function watch(){
    if(!es||es.readyState===2||Date.now()-lastBeat>70000)connect();
  }

  function wake(){
    if(document.hidden)return;
    if(Date.now()-lastConn>3000)connect();
    checkUpdate();
  }

  main.addEventListener("change",function(e){
    var b=e.target;
    if(b&&b.type==="checkbox")send({k:"c",i:b.getAttribute("data-id"),v:b.checked?1:0,t:Date.now()});
  });

  main.addEventListener("click",function(e){
    var d=e.target,id=d&&d.getAttribute?d.getAttribute("data-del"):null;
    if(!id)return;
    if(!d.classList.contains("armed")){
      d.classList.add("armed");d.textContent="Löschen?";
      setTimeout(function(){d.classList.remove("armed");d.textContent="\u00d7";},3000);
      return;
    }
    send({k:"d",i:id,t:Date.now()});
  });

  form.addEventListener("submit",function(e){
    e.preventDefault();
    var n=nameIn.value.trim(),qv=qtyIn.value.trim();
    if(!n){nameIn.focus();return;}
    send({k:"a",i:"x"+Date.now().toString(36)+Math.random().toString(36).slice(2,8),n:n,q:qv,t:Date.now()});
    nameIn.value="";qtyIn.value="";nameIn.focus();
  });

  var armTimer=null;
  function disarm(){resetBtn.classList.remove("armed");resetBtn.textContent="Alle Häkchen entfernen (für alle)";}
  resetBtn.addEventListener("click",function(){
    if(!resetBtn.classList.contains("armed")){
      resetBtn.classList.add("armed");
      resetBtn.textContent="Nochmals tippen zum Entfernen";
      armTimer=setTimeout(disarm,3000);
      return;
    }
    clearTimeout(armTimer);
    send({k:"r",t:Date.now()});
    disarm();
  });
  reloadBtn.addEventListener("click",reload);

  document.addEventListener("visibilitychange",wake);
  window.addEventListener("online",wake);
  window.addEventListener("pageshow",function(e){if(e.persisted)wake();});
  setInterval(function(){if(document.hidden)return;watch();flush();checkUpdate();},15000);

  setLive(false);
  render();
  connect();
  checkUpdate();
})();
</script>
</body>
</html>
